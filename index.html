<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz cumpleaños chicho</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#b99b7b;font-family:Georgia,serif}

#bg{position:fixed;inset:0;z-index:-1}
#bg img{width:100%;height:100%;object-fit:cover;display:block}

#scene{position:fixed;inset:0;display:grid;place-items:center;padding:4vmin}

#card{position:relative;width:min(92vw,1020px,calc(84vh*1.42));aspect-ratio:1.42}
#card img{width:100%;height:100%;object-fit:cover;display:block;border-radius:8px}

#cover{position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:min(78vw,calc(84vh*.71),540px);aspect-ratio:.71;z-index:5;cursor:pointer;
  box-shadow:0 18px 40px #0006;transition:transform 1s ease,opacity .9s ease;
  transform-origin:left center}
#cover img{box-shadow:0 0 0 6px #f3e7c9, 0 14px 34px #0005}
#card.open #cover{transform:perspective(1400px) rotateY(-108deg);opacity:0;pointer-events:none}
.chip{position:absolute;left:50%;bottom:-14px;translate:-50%;white-space:nowrap;
  background:#f3e7c9;color:#8f1010;font:bold 13px 'Segoe Print','Comic Sans MS',cursive;
  padding:6px 14px;transform:rotate(-2deg);box-shadow:0 4px 10px #0004;
  clip-path:polygon(2% 10%,98% 0,100% 88%,0 100%)}

#book{position:absolute;inset:0;display:flex;opacity:0;transform:scale(.9);
  pointer-events:none;transition:opacity .8s .35s,transform .8s .35s;
  filter:drop-shadow(0 20px 40px #0007)}
#card.open #book{opacity:1;transform:scale(1);pointer-events:auto}
.page{position:relative;flex:1;height:100%;overflow:hidden}
.fold{width:12px;background:linear-gradient(90deg,#0006,#0000 45%,#0000 55%,#0006),#8a6f52}

#envZone{position:absolute;left:15%;top:16%;width:76%;height:70%;cursor:pointer}
#hintSobre{position:absolute;left:50%;bottom:4%;translate:-50%;
  background:#f3e7c9;color:#8f1010;font:bold 14px 'Segoe Print','Comic Sans MS',cursive;
  padding:6px 16px;transform:rotate(2deg);clip-path:polygon(0 12%,100% 0,98% 90%,2% 100%);
  box-shadow:0 4px 10px #0004;animation:wig 2s infinite}
@keyframes wig{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-2deg)}}

#letterModal{position:fixed;inset:0;z-index:50;background:#000a;display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .4s}
#letterModal.show{opacity:1;pointer-events:auto}
#letterModal img{width:min(560px,92vw);max-height:88vh;object-fit:contain;
  box-shadow:0 24px 60px #000c;border-radius:4px;
  transform:translate(-32%,38%) scale(.2) rotate(-6deg);opacity:0;
  transition:transform .7s cubic-bezier(.2,.9,.3,1.1),opacity .5s}
#letterModal.show img{transform:none;opacity:1}
#closeLetter{position:fixed;top:14px;right:14px;border:none;cursor:pointer;
  background:#f3e7c9;color:#8f1010;font:bold 13px 'Segoe Print','Comic Sans MS',cursive;
  padding:7px 16px;transform:rotate(2deg);box-shadow:0 4px 12px #0006;
  clip-path:polygon(1% 12%,99% 0,100% 90%,0 100%)}

#pageR{--f1x:27.1%;--f1y:37.8%;--f2x:50%;--f2y:40.2%;--f3x:72.7%;--f3y:38.3%}
.snuff{position:absolute;translate:-50% -50%;width:15%;aspect-ratio:1;pointer-events:none}
.snuff .patch{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #d6c4a6 0 45%, #d2c0a2 58%, transparent 72%);
  transform:scale(0);transition:transform .25s}
.snuff .smoke{position:absolute;left:50%;top:40%;translate:-50%;width:70%;aspect-ratio:1;
  background:radial-gradient(circle at 50% 60%, #9a9a9aE6 0 30%, #bdbdbdB0 50%, transparent 70%);
  border-radius:50%;opacity:0}
.snuff.out .patch{transform:scale(1)}
.snuff.out .smoke{animation:puff 1.4s ease-out forwards}
@keyframes puff{0%{opacity:.9;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-90px) scale(1.7)}}

#blowBtn{position:absolute;left:50%;bottom:2.5%;translate:-50%;border:none;cursor:pointer;
  background:#f3e7c9;color:#171310;transform:rotate(-2.5deg);
  font:bold clamp(15px,2.2vw,20px) 'Segoe Print','Bradley Hand','Comic Sans MS',cursive;
  letter-spacing:1px;padding:10px 22px;box-shadow:0 6px 14px #0005;
  clip-path:polygon(1% 15%,4% 0,97% 4%,100% 30%,98% 96%,94% 100%,3% 98%,0 70%)}
#blowBtn:active{transform:rotate(-2.5deg) scale(.95)}
#micStrip{position:absolute;right:3%;top:2.5%;cursor:pointer;border:none;
  background-color:#efe2c2;color:#8f1010;font:bold 12px 'Segoe Print','Comic Sans MS',cursive;
  padding:6px 12px;transform:rotate(2deg);box-shadow:0 4px 10px #0004;
  clip-path:polygon(0 10%,100% 0,99% 92%,1% 100%)}
#micStrip.listening{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:rotate(2deg) scale(1.08)}}
#felizNote{position:absolute;left:50%;top:12%;translate:-50%;display:none;white-space:nowrap;
  background:#f3e7c9;color:#c0271c;transform:rotate(2deg);
  font:bold clamp(16px,2.6vw,24px) 'Segoe Print','Comic Sans MS',cursive;
  padding:10px 24px;box-shadow:0 8px 18px #0006;
  clip-path:polygon(2% 20%,5% 0,96% 6%,100% 40%,98% 95%,93% 100%,4% 96%,0 65%)}
#resetBtn{position:absolute;right:3%;bottom:3%;display:none;border:none;cursor:pointer;
  background:#efe2c2;color:#171310;font:bold 12px 'Segoe Print','Comic Sans MS',cursive;
  padding:6px 12px;transform:rotate(-2deg);clip-path:polygon(0 12%,100% 0,99% 90%,1% 100%)}

#closeCard{position:fixed;bottom:10px;left:50%;translate:-50%;border:none;cursor:pointer;
  background:#00000055;color:#f3e7c9;font:bold 12px Georgia,serif;padding:6px 16px;border-radius:999px}
</style>
</head>
<body>

<div id="bg"><img data-base="fondo de la pagina" alt="Fondo"></div>

<div id="scene">
  <div id="card">
    <div id="book">
      <div class="page" id="pageL">
        <img data-base="2" alt="Sobre con la carta">
        <div id="envZone" title="Toca el sobre"></div>
        <div id="hintSobre">toca el sobre</div>
      </div>
      <div class="fold"></div>
      <div class="page" id="pageR">
        <img data-base="4" alt="Pastel con velas">
        <div class="snuff" style="left:var(--f1x);top:var(--f1y)"><i class="patch"></i><i class="smoke"></i></div>
        <div class="snuff" style="left:var(--f2x);top:var(--f2y)"><i class="patch"></i><i class="smoke"></i></div>
        <div class="snuff" style="left:var(--f3x);top:var(--f3y)"><i class="patch"></i><i class="smoke"></i></div>
        <div id="felizNote">Feliz cumpleaños, Chichooo</div>
        <button id="micStrip">activar micrófono</button>
        <button id="blowBtn">SOPLAR LAS VELAS</button>
        <button id="resetBtn">encender de nuevo</button>
      </div>
    </div>
    <div id="cover">
      <img data-base="1" alt="Portada">
      <div class="chip">toca para abrir</div>
    </div>
  </div>
</div>

<div id="letterModal">
  <img data-base="3" alt="Carta">
  <button id="closeLetter">cerrar carta</button>
</div>
<button id="closeCard">cerrar tarjeta</button>

<audio id="song" loop preload="auto"></audio>

<script>
document.querySelectorAll('img[data-base]').forEach(img=>{
  const exts=['png','jpg','jpeg','webp']; let i=0;
  const next=()=>{ if(i<exts.length) img.src=encodeURI(img.dataset.base+'.'+exts[i++]);
    else img.alt='Falta '+img.dataset.base; };
  img.addEventListener('error',next); next();
});
const song=document.getElementById('song');
(function(){
  const nombres=['cancion','Cancion de cumpleaños'];
  const exts=['mp3','m4a','wav','ogg'];
  let n=0,i=0;
  const probar=()=>{
    if(n>=nombres.length) return;
    if(i>=exts.length){ n++; i=0; probar(); return; }
    song.src=encodeURI(nombres[n]+'.'+exts[i++]);
  };
  song.addEventListener('error',probar);
  probar();
})();

const card=document.getElementById('card');
document.getElementById('cover').addEventListener('click',()=>{
  card.classList.add('open');
  song.play().catch(()=>{});
});
document.getElementById('closeCard').addEventListener('click',()=>{
  card.classList.remove('open');
  song.pause();
});

const modal=document.getElementById('letterModal');
document.getElementById('envZone').addEventListener('click',()=>{
  modal.classList.add('show');
  document.getElementById('hintSobre').style.display='none';
});
document.getElementById('closeLetter').addEventListener('click',()=>modal.classList.remove('show'));
modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show');});

const snuffs=[...document.querySelectorAll('.snuff')];
let out=false;
function blowOut(){
  if(out)return; out=true;
  snuffs.forEach((s,i)=>setTimeout(()=>s.classList.add('out'),i*350));
  setTimeout(()=>{
    document.getElementById('felizNote').style.display='block';
    document.getElementById('resetBtn').style.display='block';
  },snuffs.length*350+900);
}
document.getElementById('blowBtn').addEventListener('click',blowOut);
document.getElementById('resetBtn').addEventListener('click',()=>{
  out=false; fired=false; blow=0;
  snuffs.forEach(s=>s.classList.remove('out'));
  document.getElementById('felizNote').style.display='none';
  document.getElementById('resetBtn').style.display='none';
});
